<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꼬리자르기 - AI 블랙박스 꼬리물기 자동 신고</title>
  <style>
    :root {
      --primary: #6d28d9;
      --primary-hover: #5b21b6;
      --primary-light: #f3e8ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem 1rem; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1.5rem; }
    header { text-align: center; padding: 1rem 0; }
    header h1 { color: var(--primary); font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; }
    header p { color: var(--text-muted); font-size: 1rem; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid var(--border); }
    .input-section { display: flex; flex-direction: column; gap: 1rem; }
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-weight: 600; font-size: 0.95rem; color: var(--text); }
    input[type="file"], textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
    textarea { resize: vertical; min-height: 100px; }
    .btn { background-color: var(--primary); color: white; border: none; border-radius: 8px; padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background-color: var(--primary-hover); }
    .btn:disabled { background-color: #a78bfa; cursor: not-allowed; }
    .loading { display: none; text-align: center; padding: 2rem; color: var(--primary); }
    .spinner { border: 4px solid var(--primary-light); border-top: 4px solid var(--primary); border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto 1rem auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .result-section { display: none; flex-direction: column; gap: 1.25rem; }
    .result-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--primary-light); padding-bottom: 0.75rem; }
    .result-title { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; }
    .status-badge.reported { background-color: #d1fae5; color: #065f46; }
    .status-badge.filtered { background-color: #fee2e2; color: #991b1b; }
    .step-list { display: flex; flex-direction: column; gap: 1rem; }
    .step-item { background: var(--primary-light); padding: 1rem; border-radius: 8px; border-left: 4px solid var(--primary); }
    .step-item h4 { font-size: 0.95rem; color: var(--primary); margin-bottom: 0.35rem; }
    .step-item p { font-size: 0.9rem; color: var(--text); line-height: 1.4; }
    .report-form { background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: monospace; white-space: pre-wrap; font-size: 0.85rem; color: #334155; }
    .error-box { display: none; background-color: #fef2f2; border: 1px solid #fca5a5; color: var(--danger); padding: 1rem; border-radius: 8px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>꼬리자르기 🚗💨</h1>
      <p>AI 블랙박스 연동 꼬리물기 자동 분석 및 안전신문고 신고 서비스</p>
    </header>
    <main class="card">
      <form id="analyzeForm" class="input-section">
        <div class="input-group">
          <label for="videoInput">블랙박스 영상 / 프레임 이미지 업로드</label>
          <input type="file" id="videoInput" accept="image/*,video/*" required>
        </div>
        <div class="input-group">
          <label for="descriptionInput">상황 설명 및 추가 정보 (선택)</label>
          <textarea id="descriptionInput" placeholder="예: 적색 신호 변경 후에도 교차로 중앙에 멈춰서 통행을 방해함."></textarea>
        </div>
        <button type="submit" id="submitBtn" class="btn">
          <span>AI 분석 및 신고 프로세스 실행</span>
        </button>
      </form>
    </main>
    <div id="loading" class="card loading">
      <div class="spinner"></div>
      <p>Gemini AI가 영상을 분석하고 있습니다...</p>
    </div>
    <div id="errorBox" class="error-box"></div>
    <section id="resultCard" class="card result-section">
      <div class="result-header">
        <div class="result-title">AI 분석 결과</div>
        <div id="statusBadge" class="status-badge">분석 완료</div>
      </div>
      <div class="step-list">
        <div class="step-item"><h4>① 꼬리물기 자동 탐지/판단</h4><p id="step1"></p></div>
        <div class="step-item"><h4>② 억울함/예외상황 정밀 필터링</h4><p id="step2"></p></div>
        <div class="step-item"><h4>③ 증거 영상/사진 자동 편집</h4><p id="step3"></p></div>
        <div class="step-item"><h4>④ 번호판 & 위반 정보 자동 추출</h4><p id="step4"></p></div>
        <div class="step-item"><h4>⑤ 안전신문고 양식 자동 매핑 & 신고</h4><div id="step5" class="report-form"></div></div>
      </div>
    </section>
  </div>
  <script>
    const analyzeForm = document.getElementById('analyzeForm');
    const videoInput = document.getElementById('videoInput');
    const descriptionInput = document.getElementById('descriptionInput');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const resultCard = document.getElementById('resultCard');

    analyzeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = videoInput.files[0];
      if (!file) return;

      loading.style.display = 'block';
      resultCard.style.display = 'none';
      errorBox.style.display = 'none';
      submitBtn.disabled = true;

      try {
        const base64Data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });

        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fileData: base64Data, mimeType: file.type, description: descriptionInput.value })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '분석 실패');

        document.getElementById('step1').textContent = data.detection;
        document.getElementById('step2').textContent = data.filtering;
        document.getElementById('step3').textContent = data.editing;
        document.getElementById('step4').textContent = data.extraction;
        document.getElementById('step5').textContent = data.reportForm;

        const statusBadge = document.getElementById('statusBadge');
        statusBadge.textContent = data.isViolation ? '신고 접수 완료' : '신고 제외';
        statusBadge.className = 'status-badge ' + (data.isViolation ? 'reported' : 'filtered');
        resultCard.style.display = 'flex';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        loading.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
